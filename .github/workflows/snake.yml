name: Generate Snake Animation

on:
  schedule:
    # Run daily at midnight
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AIoniser
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin output || echo "No output branch found"
          git checkout output 2>/dev/null || git checkout -b output
          cp dist/* .
          git add github-contribution-grid-snake*.svg
          git commit -m "Generate snake animation SVG" || exit 0
          git push origin output
